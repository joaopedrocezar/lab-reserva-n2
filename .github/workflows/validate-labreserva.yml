name: Validate LabReserva
on:
  push:
    branches:
      - refactor/n2-revisao-codigo
  pull_request:
    branches:
      - main
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with GCC and Clang
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O0 reserva_labs.c -o /tmp/labreserva
          clang -std=c11 -Wall -Wextra -Werror -pedantic -O0 reserva_labs.c -o /tmp/labreserva-clang
      - name: Test new booking flow
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import tempfile
          binary = pathlib.Path("/tmp/labreserva")

          def execute(directory, commands):
              result = subprocess.run(
                  [str(binary)], cwd=directory, input="\n".join(commands) + "\n",
                  text=True, capture_output=True, timeout=15)
              assert result.returncode == 0, (result.returncode, result.stdout, result.stderr)
              return result.stdout

          with tempfile.TemporaryDirectory() as d:
              out = execute(d, ["1", "1", "18/06/2040", "3", "25", "1",
                                "Carlos", "0013", "Matematica", "n", "0", "1", "0", "0"])
              assert "1 reserva(s) confirmada(s)" in out, out
              assert (pathlib.Path(d) / "reservas_lab.dat").is_file()

              out = execute(d, ["1", "2", "0", "0"])
              assert "Carlos" in out and "Noite" in out, out

              out = execute(d, ["1", "1", "19/06/2040", "1", "40", "0", "0", "0"])
              assert "Nenhum laboratorio comporta 40 alunos" in out, out

              out = execute(d, ["1", "1", "18/06/2040", "3", "25",
                                "1", "3", "Marina", "0024", "Quimica", "n", "0", "1", "0", "0"])
              assert "Este laboratorio ja esta ocupado nesse turno" in out, out
              assert "1 reserva(s) confirmada(s)" in out, out

          with tempfile.TemporaryDirectory() as d:
              out = execute(d, ["1", "1", "25/06/2040", "3", "25", "1",
                                "Ana", "0030", "Fisica", "n", "0", "1", "0", "0"])
              assert "1 reserva(s) confirmada(s)" in out, out

              out = execute(d, ["1", "1", "18/06/2040", "3", "25", "1",
                                "Bruno", "0040", "Fisica", "n", "2", "1", "0", "0"])
              assert "laboratorio indisponivel (ignorada)" in out, out
              assert "2 reserva(s) confirmada(s)" in out, out

          print("All shift-based reservation scenarios passed")
          PY
